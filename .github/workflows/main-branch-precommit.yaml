name: Ensure Pre-commit

on:
  workflow_dispatch:
  push:
    branches:
    - main

permissions: read-all

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Pre-commit
      uses: pre-commit/action@v3.0.1
