name: Build Image

on:
  workflow_dispatch:
  push:
    branches:
    - main

permissions:
  contents: read
  packages: write # Crucial for pushing to ghcr.io

env:
  GOTOOLCHAIN: auto

jobs:
  build:
    uses: ibm-aiu/spyre-operator-actions/.github/workflows/build-image.yaml@main
    with:
      dockerfile: Dockerfile
      image_name: spyre-metric-exporter
  build-mock-user:
    uses: ibm-aiu/spyre-operator-actions/.github/workflows/build-image.yaml@main
    with:
      dockerfile: ./mock/Dockerfile
      image_name: spyre-mock-user
